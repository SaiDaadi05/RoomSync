<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>Offline · RoomSync</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #fff6f0; color: #0f172a; font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 22rem; padding: 2rem 1.25rem; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 1.25rem; margin: 1rem 0 .25rem; }
  p { color: #64748b; margin: 0 0 1.5rem; font-size: .95rem; }
  button { appearance: none; border: 0; border-radius: .75rem; background: #ff6b4a; color: #fff; font: inherit; font-weight: 600; min-height: 44px; padding: 0 1.25rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>RoomSync needs a connection to load your household. Nothing you saved is lost. Try again when you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
