name: Reminders

# Vercel Hobby cron jobs run at most once a day, but "due soon" reminders need a check every
# few minutes. This calls the deployed reminders endpoint every 15 minutes instead.
# Needs two repository secrets: APP_URL (e.g. https://roomsync.vercel.app) and CRON_SECRET
# (same value as the Vercel env var). Skips quietly until they're set.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call reminders endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS -m 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
